[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ldmv"
version = "0.1.0"
description = "Logiciel de montage vidéo inspiré de CapCut, avec coupe automatique des silences"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
ui = ["PySide6>=6.5"]
dev = ["pytest>=7"]

[project.scripts]
ldmv = "ldmv.__main__:main"
ldmv-silence = "ldmv.cli:main"

[tool.setuptools.packages.find]
include = ["ldmv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
